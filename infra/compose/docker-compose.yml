name: anytech

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: anytech
      POSTGRES_USER: anytech
      POSTGRES_PASSWORD: anytech
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anytech"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  api:
    build: ../../apps/api
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://anytech:anytech@postgres:5432/anytech
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ../../apps/api
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://anytech:anytech@postgres:5432/anytech
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  postgres_data:
  redis_data:
